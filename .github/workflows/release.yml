name: Release

# Publishes the package to npm on a version tag (`v*`) via npm trusted
# publishing (GitHub Actions OIDC) — the ONLY publish path. No npm token
# exists anywhere: the runner exchanges its OIDC identity for a
# short-lived publish credential, and the publish carries a provenance
# attestation bound to this repository and this workflow file. Local
# publishes never happen; a release is: PR → merge → tag vX.Y.Z.
#
# The gate runs first — exactly the same entry points as ci.yml
# (npm run gate + npm run gate:render), so the publish proof and the PR
# proof are one definition and cannot drift.
#
# The publish step runs ONLY once the package is registered on npm.
# Until the one-time manual first publish and the trusted-publisher
# enrollment on npmjs.com (runbook: docs/deployment/npm-releases.md in
# the smart repo), the job builds the fixture against the tag, prints
# the note, and skips the publish instead of failing red.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: test/fixture/package-lock.json
      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION."
            exit 1
          fi
      - name: Build the fixture site
        working-directory: test/fixture
        run: |
          npm ci
          npm run build
      - name: The gate — compile checks + theme guard
        run: npm run gate
      - name: Install chromium for the render leg
        working-directory: test/fixture
        run: npx playwright install --with-deps chromium
      - name: The gate — render leg, both color schemes
        run: npm run gate:render
      - name: Check the package is registered on npm
        id: gate
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME" version > /dev/null 2>&1; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Note the pending first publish
        if: steps.gate.outputs.registered == 'false'
        run: |
          NAME="$(node -p "require('./package.json').name")"
          echo "::notice::$NAME is not on the npm registry yet, the publish is skipped."
          echo "Do the one-time manual publish and enroll the trusted publisher"
          echo "(docs/deployment/npm-releases.md in the smart repo), then re-run this job."
      - name: Publish with provenance
        if: steps.gate.outputs.registered == 'true'
        run: npm publish --provenance --access public
