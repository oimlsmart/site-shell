name: Release

# Publishes the package to npm on a version tag (`v*`) via npm trusted
# publishing (GitHub Actions OIDC), the same machinery as primmel-ts.
# No npm token is stored anywhere: the runner exchanges its OIDC
# identity for a short-lived publish credential, and the publish
# carries a provenance attestation bound to this repository and this
# workflow file.
#
# The shell's own gate runs first, the same proof as ci.yml: the
# fixture site consumes the package and the chrome must compile into
# the output before any publish runs.
#
# The publish step runs ONLY once the package is registered on npm.
# Until the one-time manual first publish and the trusted-publisher
# enrollment on npmjs.com (runbook: docs/deployment/npm-releases.md in
# the smart repo), the job builds the fixture against the tag, prints
# the note, and skips the publish instead of failing red.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: test/fixture/package-lock.json
      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION."
            exit 1
          fi
      - name: Build the fixture site (the shell's proof)
        working-directory: test/fixture
        run: |
          npm ci
          npm run build
      - name: The chrome compiled into the output
        working-directory: test/fixture
        run: |
          test -f dist/index.html
          grep -q "site-nav" dist/index.html
          grep -q "OIML SMART" dist/index.html
          grep -q "color-brand" dist/_astro/*.css
          echo "header + brand + tokens present in the built page"
      - name: Check the package is registered on npm
        id: gate
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME" version > /dev/null 2>&1; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Note the pending first publish
        if: steps.gate.outputs.registered == 'false'
        run: |
          NAME="$(node -p "require('./package.json').name")"
          echo "::notice::$NAME is not on the npm registry yet, the publish is skipped."
          echo "Do the one-time manual publish and enroll the trusted publisher"
          echo "(docs/deployment/npm-releases.md in the smart repo), then re-run this job."
      - name: Publish with provenance
        if: steps.gate.outputs.registered == 'true'
        run: npm publish --provenance --access public
