name: ci

# The shell's proof: the fixture site consumes the package and builds —
# the gate (npm run gate + gate:render) proves the chrome compiles in,
# both color schemes lay out, and no theme-class rule blanks a scheme.
# The same gate runs in release.yml — one definition, no drift.

on:
  push: { branches: [main] }
  pull_request: {}
  schedule: [cron: '9 4 * * 1']  # weekly, Monday 04:09 UTC (off-peak)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fixture-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: test/fixture/package-lock.json }
      - run: npm ci
        working-directory: test/fixture
      - run: npm run build
        working-directory: test/fixture
      - name: The gate — compile checks + theme guard
        run: npm run gate
      - name: Install chromium for the render leg
        working-directory: test/fixture
        run: npx playwright install --with-deps chromium
      - name: The gate — render leg, both color schemes
        run: npm run gate:render
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fixture-dist
          path: |
            test/fixture/dist
            test/fixture/artifacts
          retention-days: 7
          if-no-files-found: ignore
